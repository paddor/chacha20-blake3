[workspace]
resolver = "2"

members = [
    "benchmarks",
    "chacha",
    "chacha20-blake3",
]

[workspace.dependencies]
blake3 = { version = "1.8.0", default-features = false, features = ["neon", "wasm32_simd"] }
constant_time_eq = "0.5.0"
zeroize = { version = "1", features = ["simd", "derive"] }
